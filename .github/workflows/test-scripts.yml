name: test-scripts

# The harnesses under scripts/ extract the real bash logic out of
# install.sh and the skill installer and run it, so
# they only stay honest if something runs them. Before this, they ran when
# a human remembered to.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Detect command drift against the current published CLI.
      - name: Install the current rook
        run: npm install -g @testmuai/rook@latest

      - name: Run the script harnesses
        env:
          # Exercises the flag harness's self-test (a `profile test --what`
          # line must fail, a `profile test --goal` line must pass, and child
          # flags after -- must be ignored) on every
          # run, not just when someone remembers to set it locally.
          SKILL_FLAGS_SELFTEST: "1"
        run: |
          shopt -s nullglob
          harnesses=(scripts/test-*.sh)
          # A glob that quietly matches nothing is a green run that checked
          # nothing. There are 7 harnesses; fewer means one was renamed or
          # deleted, and that should be a red run, not a silent gap.
          if [ "${#harnesses[@]}" -lt 7 ]; then
            echo "::error::expected at least 7 harnesses matching scripts/test-*.sh, found ${#harnesses[@]}"
            exit 1
          fi
          for t in "${harnesses[@]}"; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

  installer-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: bash scripts/test-skill-installer.sh
