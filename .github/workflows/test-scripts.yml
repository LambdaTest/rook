name: test-scripts

# The harnesses under scripts/ extract the real sed/Python/bash logic
# out of the committed workflow files and install.sh and run it, so
# they only stay honest if something runs them. Before this, they ran when
# a human remembered to.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The flag harness checks the skill against the rook it describes.
      - name: Install the pinned rook
        run: npm install -g @testmuai/rook@0.1.1

      # ubuntu-latest ships GNU sed, so test-formula-patch.sh's gsed
      # fallback (for BSD sed on macOS) is simply unused here.
      - name: Run the script harnesses
        env:
          # Exercises the flag harness's self-test (a `profile test --what`
          # line must fail, a `profile test --goal` line must pass) on every
          # run, not just when someone remembers to set it locally.
          SKILL_FLAGS_SELFTEST: "1"
        run: |
          shopt -s nullglob
          harnesses=(scripts/test-*.sh)
          # A glob that quietly matches nothing is a green run that checked
          # nothing. There are 9 harnesses; fewer means one was renamed or
          # deleted, and that should be a red run, not a silent gap.
          if [ "${#harnesses[@]}" -lt 9 ]; then
            echo "::error::expected at least 9 harnesses matching scripts/test-*.sh, found ${#harnesses[@]}"
            exit 1
          fi
          for t in "${harnesses[@]}"; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
