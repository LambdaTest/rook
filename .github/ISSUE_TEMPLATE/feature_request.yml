name: Feature request
description: Something rook should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution. What kind of agent, and what you are
        trying to learn about it that rook cannot tell you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you think would solve it
      description: Optional. A shape, a command, a flag — whatever you had in mind.

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: Optional, and useful. It tells us how much the gap costs.
