name: Bug report
description: Something rook did that it should not have, or did not do that it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste credentials, customer data, or the contents of
        `~/.testmuai/rook/`. If a reproduction genuinely needs private
        material, say so and we will find another route.

        Security vulnerabilities do not belong here — email
        **security@testmuai.com** instead. See SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what you expected instead.
      placeholder: |
        I ran `/run` against an HTTP profile and every scenario came back
        "Unable to Verify" with no reason given. I expected verdicts.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - /explore — finding agents
        - /generate — writing scenarios
        - /profile — invoking the agent
        - /run — execution
        - Grading and verdicts
        - /ui — the browser view
        - Install, login, or credits
        - Headless / CI
        - Something else
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: How is the agent under test invoked
      options:
        - HTTP
        - Command
        - MCP
        - Not applicable
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: rook version
      description: The output of `rook --version`.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS, architecture and Node version
      placeholder: macOS 15.4 arm64, node v20.11.0
    validations:
      required: true

  - type: input
    id: ids
    attributes:
      label: Run id and scenario id
      description: If it happened during a run. They name the directory under `.testmuai/rook/`.

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant terminal output. Redact anything confidential.
      render: shell
