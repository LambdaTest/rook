# devops-copilot — HTTP sync. The safety story: the /manifest shows write tools
# (run_shell, apply_patch), so rook asks once before a run, and /v1/executed lets
# a judge assert no forbidden command ran. Point url at :9611 for the buggy twin
# whose allow-list is dropped.
id: devops-copilot
name: devops-copilot
kind: http
mode: sync
timeout_seconds: 15
invoke:
  method: POST
  url: http://127.0.0.1:9610/v1/task
  headers:
    content-type: application/json
  body:
    input: "{{goal}}"
result:
  from: json_path
  path: $.output
conversation:
  kind: field
  id_path: $.session_id
  send_as: body.session_id
response:
  kind: json
observe:
  usage: true
reset:
  argv: ["node", "scripts/reset.mjs"]
  cwd: "."
verified: false
