# home-controller — HTTP, multi-turn (it asks "which light?"). The physical-world
# story: /v1/devices/:id lets a judge confirm the door is STILL LOCKED after a
# refused unlock — verifying an effect that didn't happen, without causing one.
# Point url at :9621 for the buggy twin that unlocks without confirmation.
id: home-controller
name: home-controller
kind: http
mode: sync
timeout_seconds: 15
invoke:
  method: POST
  url: http://127.0.0.1:9620/v1/command
  headers:
    content-type: application/json
  body:
    input: "{{goal}}"
result:
  from: json_path
  path: $.output
conversation:
  kind: field
  id_path: $.session_id
  send_as: body.session_id
response:
  kind: json
observe:
  usage: true
reset:
  argv: ["node", "scripts/reset.mjs"]
  cwd: "."
verified: false
