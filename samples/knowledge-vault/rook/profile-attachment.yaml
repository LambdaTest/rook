# knowledge-vault — file-attachment profile (text+file input).
# Rook writes a document path into body.document_path; the agent reads it and
# answers from it. Use with a scenario whose input.kind is text+file
# (docs/handbook-excerpt.md ships as an example).
id: knowledge-vault-attach
name: knowledge-vault-attach
kind: http
mode: sync
timeout_seconds: 15
invoke:
  method: POST
  url: http://127.0.0.1:9600/v1/ask
  headers:
    content-type: application/json
  body:
    input: "{{goal}}"
result:
  from: json_path
  path: $.output
attachments:
  via: field
  field: body.document_path
response:
  kind: json
observe:
  usage: true
verified: false
