# knowledge-vault — base profile (grounding + multi-turn).
# HTTP, sync. POSTs the goal to /v1/ask and reads the answer from $.output.
# Point `url` at a twin to watch verdicts flip: :9601 buggy · :9602 leaky · :9603 rbac-off.
id: knowledge-vault
name: knowledge-vault
kind: http
mode: sync
timeout_seconds: 15
invoke:
  method: POST
  url: http://127.0.0.1:9600/v1/ask
  headers:
    content-type: application/json
  body:
    input: "{{goal}}"
result:
  from: json_path
  path: $.output
conversation:
  kind: field
  id_path: $.session_id
  send_as: body.session_id
response:
  kind: json
observe:
  usage: true
reset:
  argv: ["node", "scripts/reset.mjs"]
  cwd: "."
verified: false
