# knowledge-vault — MCP transport profile (stdio JSON-RPC).
# Rook invokes the `search` tool on the `vault` MCP server declared in
# .mcp.json. The same server also exposes read_document, list_domains, the
# admin-only read_audit, and the RBAC-gated write tools; `tools/list` discovers
# them all without a model, and a judge can mcp_call search / read_document to
# verify an answer was grounded.
id: knowledge-vault-mcp
name: knowledge-vault-mcp
kind: mcp
mode: sync
timeout_seconds: 15
invoke:
  server: vault
  tool: search
  arguments:
    query: "{{goal}}"
result:
  from: text
response:
  kind: json
verified: false
