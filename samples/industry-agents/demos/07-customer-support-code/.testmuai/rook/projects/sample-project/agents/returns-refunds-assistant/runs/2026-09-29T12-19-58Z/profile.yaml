  open: >-
    .testmuai/rook/projects/sample-project/agents/returns-refunds-assistant/scripts/demo-http.mjs
  execute: >-
    .testmuai/rook/projects/sample-project/agents/returns-refunds-assistant/scripts/demo-http.mjs
  close: >-
    .testmuai/rook/projects/sample-project/agents/returns-refunds-assistant/scripts/demo-http.mjs
  collect: >-
    .testmuai/rook/projects/sample-project/agents/returns-refunds-assistant/scripts/demo-http.mjs
