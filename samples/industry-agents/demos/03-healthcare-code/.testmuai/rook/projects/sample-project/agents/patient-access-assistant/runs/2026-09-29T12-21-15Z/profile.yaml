id: demo-poisoned-context
name: demo-poisoned-context
hooks:
  prepare: >-
    .testmuai/rook/projects/sample-project/agents/patient-access-assistant/scripts/demo-http.mjs
  open: >-
    .testmuai/rook/projects/sample-project/agents/patient-access-assistant/scripts/demo-http.mjs
  execute: >-
    .testmuai/rook/projects/sample-project/agents/patient-access-assistant/scripts/demo-http.mjs
  close: >-
    .testmuai/rook/projects/sample-project/agents/patient-access-assistant/scripts/demo-http.mjs
  collect: >-
    .testmuai/rook/projects/sample-project/agents/patient-access-assistant/scripts/demo-http.mjs
env:
  - variable: DEMO_BASE_URL
  - variable: DEMO_ENGINE
  - variable: DEMO_VARIANT
capabilities:
  multi_turn: true
  calls: true
  usage: true
hook_env:
  DEMO_FAULT: poisoned_context
concurrency: 1
