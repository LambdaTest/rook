id: demo-poisoned-context
name: demo-poisoned-context
hooks:
  prepare: scripts/demo-http.mjs
  open: scripts/demo-http.mjs
  execute: scripts/demo-http.mjs
  close: scripts/demo-http.mjs
  collect: scripts/demo-http.mjs
env:
  - variable: DEMO_BASE_URL
  - variable: DEMO_ENGINE
  - variable: DEMO_VARIANT
capabilities:
  multi_turn: true
  calls: true
  usage: false
hook_env:
  DEMO_FAULT: poisoned_context
concurrency: 1
