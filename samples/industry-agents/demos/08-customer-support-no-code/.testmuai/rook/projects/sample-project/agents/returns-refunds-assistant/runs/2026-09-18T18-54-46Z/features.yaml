  assumptions:
    - The assistant can identify customer ownership from the authenticated session and order record.
  sources:
    - 'PRD.md: Customer and workflow'
    - 'PRD.md: Required behavior'
    - 'PRD.md: Acceptance examples — CUSTOMER-SUPPORT-13'
  known_data:
    - ORD-200
  confidence: null
